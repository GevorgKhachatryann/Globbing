name: Playwright Tests
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-mail-dependent:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run mailbox-dependent Playwright tests
        run: npx playwright test --grep "@needs-mailbox" --workers=1
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mail-dependent
          path: playwright-report/
          retention-days: 14

  test-general:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check secrets are present
        run: |
          [ -n "$APP_USERNAME" ] && echo "APP_USERNAME: OK" || echo "APP_USERNAME: MISSING"
          [ -n "$BASIC_AUTH_USER" ] && echo "BASIC_AUTH_USER: OK" || echo "BASIC_AUTH_USER: MISSING"
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}

      - name: Run general Playwright tests
        run: npx playwright test --grep-invert "@needs-mailbox" --workers=4
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-general
          path: playwright-report/
          retention-days: 14